info:
  title: core-service
  description: Marcas, campañas, publicaciones, analítica e ideas de contenido
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
    CreateSpecialtyDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateSpecialtyDto:
      type: object
      properties:
        name:
          type: string
    CreateSocialNetworkDto:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        baseEngagementRate:
          type: number
      required:
        - name
        - code
        - baseEngagementRate
    UpdateSocialNetworkDto:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        baseEngagementRate:
          type: number
    UpsertUserProfileDto:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        roleNames:
          type: array
          items:
            type: string
            enum:
              - cliente
              - cm
              - disenador
        categoryIds:
          type: array
          items:
            type: string
        specialtyIds:
          type: array
          items:
            type: string
      required:
        - userId
        - name
        - roleNames
    CreateBrandDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        profileType:
          type: string
          enum:
            - brand
            - profile
        logoUrl:
          type: string
        primaryColor:
          type: string
        allowedSocial:
          type: array
          items:
            type: string
      required:
        - name
        - slug
        - allowedSocial
    UpdateBrandDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        profileType:
          type: string
          enum:
            - brand
            - profile
        logoUrl:
          type: string
        primaryColor:
          type: string
    CreateCampaignDto:
      type: object
      properties:
        brandId:
          type: string
        name:
          type: string
        description:
          type: string
        objective:
          type: string
        cmId:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        categoryIds:
          type: array
          items:
            type: string
      required:
        - brandId
        - name
        - cmId
    UpdateCampaignDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        objective:
          type: string
        cmId:
          type: string
        status:
          type: string
          enum:
            - active
            - paused
            - finished
        startDate:
          type: string
        endDate:
          type: string
    AssignDesignerDto:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    CreatePostDto:
      type: object
      properties:
        brandId:
          type: string
        campaignId:
          type: string
        socialNetworkIds:
          type: array
          items:
            type: string
        content:
          type: string
        instructions:
          type: string
          nullable: true
        scheduledAt:
          type: string
          nullable: true
      required:
        - brandId
        - campaignId
        - socialNetworkIds
        - content
    CreateReportDto:
      type: object
      properties:
        brandId:
          type: string
        format:
          type: string
          enum:
            - csv
            - pdf
      required:
        - brandId
        - format
    CreateIdeaDto:
      type: object
      properties:
        campaignId:
          type: string
        text:
          type: string
        title:
          type: string
        source:
          type: string
          enum:
            - sugerida
            - propia
      required:
        - campaignId
        - text
    UpdateIdeaDto:
      type: object
      properties:
        text:
          type: string
        title:
          type: string
