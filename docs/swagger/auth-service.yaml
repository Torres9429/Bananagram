info:
  title: auth-service
  description: Autenticación, usuarios, roles y privilegios
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 1
        avatarUrl:
          type: string
        roleName:
          type: string
          enum:
            - cliente
            - cm
            - disenador
        categoryIds:
          type: array
          items:
            type: string
        specialtyIds:
          type: array
          items:
            type: string
      required:
        - email
        - password
        - name
        - roleName
    LoginDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    PasswordResetRequestDto:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    PasswordResetConfirmDto:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 6
      required:
        - token
        - newPassword
    RedeemLinkCodeDto:
      type: object
      properties:
        code:
          type: string
      required:
        - code
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        roleName:
          type: string
      required:
        - email
        - password
        - roleName
    UpdateUserDto:
      type: object
      properties:
        email:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
    AssignRoleDto:
      type: object
      properties:
        roleId:
          type: string
      required:
        - roleId
    CreateRoleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
      required:
        - name
    UpdateRolePermissionDto:
      type: object
      properties:
        moduleSlug:
          type: string
        actionSlug:
          type: string
        allowed:
          type: boolean
      required:
        - moduleSlug
        - actionSlug
        - allowed
    CompleteProfileDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        avatarUrl:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        specialtyIds:
          type: array
          items:
            type: string
      required:
        - name
    CreateNotificationDto:
      type: object
      properties:
        userId:
          type: string
        type:
          type: string
          minLength: 1
        payload:
          type: object
      required:
        - userId
        - type
