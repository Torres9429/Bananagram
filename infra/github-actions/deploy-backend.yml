name: Deploy Backend
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, core-service, alexa-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          case "${{ matrix.service }}" in
            api-gateway)
              echo "path=apps/backend/gateway/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "path=apps/backend/services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Build & Push
        run: |
          docker build \
            -f ${{ steps.dockerfile.outputs.path }} \
            -t ${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }} \
            .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
      - name: Deploy ECS
        run: |
          aws ecs update-service --cluster gestor-redes --service ${{ matrix.service }} --force-new-deployment
