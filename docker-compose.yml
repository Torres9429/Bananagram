# Uso recomendado para desarrollo diario (liviano):
#   docker compose up -d              # solo postgres + adminer
#   pnpm dev                          # backend + fronts corriendo en el host (más rápido, hot reload)
#
# Uso para levantar el stack completo containerizado (más pesado, útil antes
# de un deploy o para probar el build de producción de cada servicio):
#   docker compose --profile full up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestor_redes
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  adminer:
    image: adminer
    ports: ["8080:8080"]

  auth-service:
    profiles: ["full"]
    build: ./apps/backend/services/auth-service
    env_file: .env
    ports: ["3001:3001"]
    depends_on: [postgres]

  brands-service:
    profiles: ["full"]
    build: ./apps/backend/services/brands-service
    env_file: .env
    ports: ["3002:3002"]
    depends_on: [postgres]

  content-service:
    profiles: ["full"]
    build: ./apps/backend/services/content-service
    env_file: .env
    ports: ["3003:3003"]
    depends_on: [postgres]

  analytics-service:
    profiles: ["full"]
    build: ./apps/backend/services/analytics-service
    env_file: .env
    ports: ["3005:3005"]
    depends_on: [postgres]

  api-gateway:
    profiles: ["full"]
    build: ./apps/backend/gateway
    env_file: .env
    ports: ["4000:4000"]
    depends_on:
      - auth-service
      - brands-service
      - content-service
      - analytics-service

  web-shell:
    profiles: ["full"]
    build: ./apps/frontend/web-shell
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api-gateway]

volumes:
  postgres_data:
